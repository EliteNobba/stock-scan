<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e79"><title>Stock Scan</title><link rel="manifest" href="manifest.webmanifest?v=1.1"><link rel="stylesheet" href="styles.css?v=1.1"></head><body>
<header><h1>Stock Scan</h1><small>iPhone PWA v1.1</small></header><main>
<section id="home" class="screen active"><button data-go="newscan">NEW SCAN</button><button data-go="current">CURRENT SCAN</button><button data-go="saved">SAVED SCANS</button><button data-go="search">PART SEARCH</button></section>
<section id="newscan" class="screen"><h2>New Scan</h2><label>Scan name<input id="scanName" placeholder="e.g. Workshop Stocktake"></label><button id="startSession">START SCAN</button><button class="secondary" data-go="home">HOME</button></section>
<section id="scanner" class="screen"><h2>Scan Barcode</h2><div class="videoWrap"><video id="video" playsinline muted autoplay></video><div class="target"></div></div><div id="scanStatus">Camera stopped</div><div id="scanDiag" style="font-size:12px;margin:8px 0;word-break:break-word"></div><button id="startCamera">OPEN SCANNER</button><button id="stopCamera" class="secondary">STOP CAMERA</button><label>Manual barcode<input id="manualBarcode" inputmode="numeric" placeholder="Enter barcode"></label><button id="useManual">USE BARCODE</button><button class="secondary" data-go="current">CURRENT SCAN</button></section>
<section id="item" class="screen"><h2>Item</h2><div class="card"><div class="kv"><b>Barcode</b><span id="itemBarcode"></span><b>Part No</b><span id="itemPart">NOT FOUND</span><b>Description</b><span id="itemDesc">Unmatched item</span><b>Supplier</b><span id="itemSupplier">—</span></div></div><div class="qty"><button id="minus">−</button><input id="qty" type="number" min="1" value="1"><button id="plus">+</button></div><label class="photoBtn">TAKE PHOTO<input id="photo" type="file" accept="image/*" capture="environment" hidden></label><img id="photoPreview" class="preview" hidden><button id="addItem">ADD TO SCAN</button><button class="secondary" data-go="scanner">SCAN ANOTHER</button></section>
<section id="current" class="screen"><h2>Current Scan</h2><div id="currentList"></div><button data-go="scanner">SCAN ITEM</button><button id="saveSession">SAVE SCAN</button><button class="secondary" data-go="home">HOME</button></section>
<section id="saved" class="screen"><h2>Saved Scans</h2><div id="savedList"></div><button class="secondary" data-go="home">HOME</button></section>
<section id="search" class="screen"><h2>Part Search</h2><p>MechanicDesk + Our Data lookup comes after the scanner test.</p><button class="secondary" data-go="home">HOME</button></section>
</main><div id="toast"></div>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><script src="app-v1.1.js"></script></body></html>
