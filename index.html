<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e79"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Stock Scan"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Stock Scan</title></head><body>
<header><h1>Stock Scan</h1><div id="sessionLabel">No active scan</div></header>
<main>
<section id="home" class="screen active"><button data-go="newscan">NEW SCAN</button><button data-go="current">CURRENT SCAN</button><button data-go="saved">SAVED SCANS</button><button data-go="search">PART SEARCH</button><p class="small">Prototype v1.0 • iPhone PWA</p></section>
<section id="newscan" class="screen"><h2>New Scan</h2><label>Scan name<input id="scanName" placeholder="e.g. Workshop Stocktake"></label><button id="startSession">START SCAN</button><button class="secondary" data-go="home">HOME</button></section>
<section id="scanner" class="screen"><h2>Scan Barcode</h2><div class="videoWrap"><video id="video" playsinline muted></video><div class="target"></div></div><div id="scanStatus">Camera stopped</div><button id="startCamera">OPEN SCANNER</button><button id="stopCamera" class="secondary">STOP CAMERA</button><label>Manual barcode<input id="manualBarcode" inputmode="numeric" placeholder="Enter barcode"></label><button id="useManual">USE BARCODE</button><button class="secondary" data-go="current">CURRENT SCAN</button></section>
<section id="item" class="screen"><h2>Item</h2><div class="card"><div class="kv"><b>Barcode</b><span id="itemBarcode"></span><b>Part No</b><span id="itemPart">NOT FOUND</span><b>Description</b><span id="itemDesc">Unmatched item</span><b>Supplier</b><span id="itemSupplier">—</span></div></div><div class="qty"><button id="minus">−</button><input id="qty" type="number" min="1" value="1"><button id="plus">+</button></div><label class="photoBtn">TAKE PHOTO<input id="photo" type="file" accept="image/*" capture="environment" hidden></label><img id="photoPreview" class="preview" hidden><button id="addItem">ADD TO SCAN</button><button class="secondary" data-go="scanner">SCAN ANOTHER</button></section>
<section id="current" class="screen"><h2>Current Scan</h2><div id="currentList"></div><button data-go="scanner">SCAN ITEM</button><button id="saveSession">SAVE SCAN</button><button class="secondary" data-go="home">HOME</button></section>
<section id="saved" class="screen"><h2>Saved Scans</h2><div id="savedList"></div><button class="secondary" data-go="home">HOME</button></section>
<section id="search" class="screen"><h2>Part Search</h2><input id="partQuery" placeholder="Part no, description or barcode"><div id="searchResults"></div><p class="small">MechanicDesk/Our Data import comes in the next build.</p><button class="secondary" data-go="home">HOME</button></section>
</main><div id="toast"></div>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><script src="app.js"></script></body></html>
